# Linked to ~/.tmux.conf: tmux < 3.1 doesn't read ~/.config/tmux/.
# Written for tmux 2.7 (RHEL 8): no terminal-features (3.2+), so true color uses Tc.
# Colors: Ghostty Dayfox theme.

set -g mouse on
set -g history-limit 50000
set -sg escape-time 10               # vim's Esc lags with the 500ms default of older tmux
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------- Terminal ----------
# Older systems have no tmux-256color terminfo
if-shell "infocmp tmux-256color >/dev/null 2>&1" \
    "set -g default-terminal tmux-256color" \
    "set -g default-terminal screen-256color"
# True color needs both: Tc tells tmux the outer terminal can do it,
# COLORTERM tells the programs inside tmux
set -ga terminal-overrides ",xterm*:Tc"
setenv -g COLORTERM truecolor
# Claude Code drops to 256 colors whenever $TMUX is set unless this is set
# (undocumented; found in the 2.1.308 binary)
setenv -g CLAUDE_CODE_TMUX_TRUECOLOR 1
set -g set-clipboard on              # OSC 52: copy over ssh into the local clipboard

# ---------- Keys ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---------- Status bar ----------
set -g status-style "bg=#ede6df,fg=#3d2b5a"
set -g status-left-length 40
set -g status-right-length 60

# Session name as a light blue block, light rose while the prefix key is pressed.
# The arrow after it is U+E0B0 from Nerd Fonts; the font renders on the local
# terminal, so remote hosts need nothing extra.
set -g status-left "#{?client_prefix,#[bg=#f5d9dc]#[fg=#a5222f],#[bg=#d9e2f5]#[fg=#2848a9]}#[bold] #S #[bg=#ede6df,nobold]#{?client_prefix,#[fg=#f5d9dc],#[fg=#d9e2f5]}#[default]  "

set -g window-status-separator " "
set -g window-status-format "#[fg=#7a6f66] #I:#W "
set -g window-status-current-format "#[bg=#f3e1cd,fg=#9a4a02,bold] #I:#W#{?window_zoomed_flag, [Z],} "

set -g status-right "#[fg=#7a6f66]#H  #[fg=#4863b6]%H:%M "

# ---------- Panes and messages ----------
# Active border matches Ghostty's split-divider-color
set -g pane-border-style "fg=#d3c7bb"
set -g pane-active-border-style "fg=#837a72"

set -g message-style "bg=#e7d2be,fg=#3d2b5a"
set -g mode-style "bg=#e7d2be,fg=#3d2b5a"
