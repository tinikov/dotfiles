# Global state rather than the project: cloud accounts and contexts, and the container or
# network namespace the shell runs in. They show in every directory while set. azure,
# kubernetes and nats stay disabled, as in starship's defaults.
aws = { symbol = " ", style = "yellow", format = '[─\[](frame)[$symbol]($style)[($profile)( \($region\))( \[$duration\])](bright-black)[\]](frame)' }
azure = { symbol = " ", style = "blue", format = '[─\[](frame)[$symbol]($style)[$subscription](bright-black)[\]](frame)' }
gcloud = { symbol = "󱇶 ", style = "blue", format = '[─\[](frame)[$symbol]($style)[$account(@$domain)( \($region\))](bright-black)[\]](frame)' }
kubernetes = { symbol = "󱃾 ", style = "blue", format = '[─\[](frame)[$symbol]($style)[$context( \($namespace\))](bright-black)[\]](frame)' }
openstack = { symbol = " ", style = "red", format = '[─\[](frame)[$symbol]($style)[$cloud( \($project\))](bright-black)[\]](frame)' }
nats = { symbol = " ", style = "cyan", format = '[─\[](frame)[$symbol]($style)[$name](bright-black)[\]](frame)' }
container = { symbol = " ", style = "red", format = '[─\[](frame)[$symbol]($style)[$name](bright-black)[\]](frame)' }
singularity = { symbol = " ", style = "blue", format = '[─\[](frame)[$symbol]($style)[$env](bright-black)[\]](frame)' }
netns = { symbol = "󰛳 ", style = "blue", format = '[─\[](frame)[$symbol]($style)[$name](bright-black)[\]](frame)' }

[palettes.dayfox]
frame = "#aab0ad" # Dayfox border color

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "blue"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_state]
format = ' \([$state( $progress_current/$progress_total)]($style)\)'
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218)( $ahead_behind$stashed)]($style)"
style = "cyan"
# The six values below are a zero-width space (U+200B), not empty strings: each kind of
# change renders nothing itself, but makes the (...) group non-empty, so any change
# shows exactly one "*". Replacing them with "" would hide the "*".
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[cmd_duration]
format = '[─\[](frame)[$duration]($style)[\]](frame)'
style = "yellow"

[fill]
symbol = "─"
style = "frame"

[time]
disabled = false
format = "[$time]($style)"
style = "bold italic green"

[battery]
format = " [$symbol]($style)"
discharging_symbol = "󰁹"
unknown_symbol = "󰚥"
full_symbol = "󰚥"
charging_symbol = "󰂄"
empty_symbol = "󰂎"

[[battery.display]]
threshold = 20
style = "bold red"
discharging_symbol = "󰂃"

[[battery.display]]
threshold = 60
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"

# Shown when the current directory is a Python project root, or a venv is active.
# The project's .venv comes first, so the version is the project's even when the venv
# isn't activated (plain `python` would be uv's global default).
[python]
symbol = " "
format = '[─\[](frame)[$symbol]($style)[($version)( \($virtualenv\))](bright-black)[\]](frame)'
style = "blue"
detect_extensions = []
detect_files = [".python-version", "pyproject.toml", "requirements.txt"]
python_binary = [".venv/bin/python", "python", "python3"]

[username]
format = "[$user]($style)"

[hostname]
format = "[@$hostname]($style)"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
