"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

# Bracketed segments joined by ─ (after Kali's prompt), framed by ╭─ and ╰─. $fill pushes
# the environment, duration and time to the right end of the first line (right_format would
# put them on the input line). The (...) groups and the modules on the right draw their own
# brackets, so a segment with nothing to show leaves no empty [].
format = """
[╭─](frame)\
([\\[](frame)$username$hostname[\\]─](frame))\
[\\[](frame)$directory[\\]](frame)\
([─\\[](frame)$git_branch$git_state$git_status[\\]](frame))\
$fill\
$buf$bun$c$cmake$cobol$conda$crystal$daml$dart$deno$docker_context$dotnet\
$elixir$elm$erlang$fortran$gleam$golang$gradle$guix_shell$haskell$haxe$helm$java\
$julia$kotlin$lua$maven$meson$mojo$nim$nix_shell$nodejs$ocaml$odin$opa\
$perl$php$pixi$pulumi$purescript$python$quarto$raku$red$rlang$ruby$rust\
$scala$solidity$spack$swift$terraform$typst$vagrant$vlang$xmake$zig\
$aws$azure$gcloud$kubernetes$openstack$nats$container$singularity$netns\
$cmd_duration\
([─\\[](frame)$time$battery[\\]](frame))\
$line_break\
[╰─](frame)\
$character"""

palette = "dayfox"

# Languages and tools, shown only in matching projects: nerd icon in the tool's color,
# version in gray. Icons from starship's nerd-font-symbols preset. These inline tables
# must stay above the first [section] header, or TOML would put them inside it.
